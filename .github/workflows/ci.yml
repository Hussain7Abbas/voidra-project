name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS quality checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Use pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Show toolchain
        run: |
          uname -ms
          node --version
          pnpm --version
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules for Electron
        run: make native
      - name: Run quality checks
        run: make check
      - name: Build workspaces and desktop
        run: make build
      - name: Run Electron workflows and accessibility
        run: make e2e
      - name: Package unsigned arm64 app
        run: make package-dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged app
        run: make smoke-packaged
