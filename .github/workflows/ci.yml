name: CI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      source-ref: ${{ github.ref }}

  package:
    name: Package verified desktop
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Use pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Show toolchain
        run: |
          uname -ms
          node --version
          pnpm --version
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Rebuild native modules for Electron
        run: make native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-build
          path: .cache/
      - run: tar -xf .cache/verified-build.tar
      - name: Package unsigned arm64 app
        run: make package-dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged app
        run: make smoke-packaged
