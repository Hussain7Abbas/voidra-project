name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag to retry
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      source-ref: ${{ inputs.tag || github.ref_name }}
  stage:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VOIDRA_RELEASE_TEST_TAG: ${{ vars.VOIDRA_RELEASE_TEST_TAG }}
      VOIDRA_RELEASE_FAILURE: ${{ vars.VOIDRA_RELEASE_FAILURE }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: make install native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-build
          path: .cache/
      - run: tar -xf .cache/verified-build.tar
      - name: Restore exact staged bytes if available
        id: checkpoint
        run: node tools/release-engine/scripts/stage.ts restore
      - name: Build and stage a new candidate
        if: steps.checkpoint.outputs.restored != 'true'
        run: |
          make package-dmg
          node tools/release-engine/scripts/stage.ts prepare
      - name: Retain the immutable staging checkpoint
        if: steps.checkpoint.outputs.restored != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.checkpoint.outputs.artifact }}
          path: .cache/release-artifacts/${{ env.RELEASE_TAG }}/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Verify the actual staged DMG
        run: node scripts/dmg-smoke.ts "../../.cache/release-artifacts/$RELEASE_TAG/Voidra-Project-${RELEASE_TAG#v}-arm64.dmg"
        working-directory: apps/desktop
      - name: Publish checked GitHub assets and dispatch npm
        run: node tools/release-engine/scripts/stage.ts publish
