name: Publish npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tested source tag with staged release assets
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter voidra build
      - name: Use the pinned OIDC-capable npm CLI
        run: npm install --global npm@11.21.0
      - name: Publish original staged archive and verify provenance
        run: node tools/release-engine/scripts/npm.ts
